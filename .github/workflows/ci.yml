name: CI

# CI runs the gate scripts only. Build trees are not cached or committed in M0;
# see docs/ci.md.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Gate G0 (Windows x64)
        shell: pwsh
        run: ./scripts/gate-windows.ps1

  linux-x64:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 development package
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Gate G0 (Linux x64)
        run: ./scripts/gate-linux.sh

  arm64:
    # Register BitWhiz as a self-hosted runner, then set the repository
    # variable KRDBG_ARM64_RUNNER=true. Until then this job is skipped, so CI
    # completes honestly instead of leaving a job queued forever; G0.9 records
    # the ARM64 job as BLOCKED for the missing runner.
    if: vars.KRDBG_ARM64_RUNNER == 'true'
    runs-on: [self-hosted, linux, arm64, raspberry-pi]
    timeout-minutes: 60
    # Non-blocking until G6 (implementation.md M2.9.2); the job still reports.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Gate G0 (Linux ARM64)
        run: ./scripts/gate-linux-arm64.sh
