name: CI

# CI runs the gate scripts only. Build trees are not cached or committed in M0;
# see docs/ci.md.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Gate G2 (Windows x64)
        shell: pwsh
        run: ./scripts/gate-windows.ps1
      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-g2-evidence
          path: |
            goldens/**
            build/gate/**
            build/windows-msvc/Testing/**
            build/windows-msvc-release/Testing/**
          if-no-files-found: warn

  linux-x64:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 development package
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Gate G2 (Linux x64)
        run: ./scripts/gate-linux.sh
      - name: Upload Linux evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-g2-evidence
          path: |
            goldens/**
            build/gate/**
            build/linux-wsl/Testing/**
            build/linux-wsl-release/Testing/**
          if-no-files-found: warn

  # ARM64 is not a GitHub Actions job. BitWhiz is a tester session that polls
  # main, runs scripts/gate-linux-arm64.sh and appends docs/arm64-test-log.md;
  # see docs/arm64-tester.md. Keep this job list to Windows and Ubuntu.
